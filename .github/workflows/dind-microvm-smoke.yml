name: "ARC DinD inside GKE Sandbox microVM Smoke"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_VERSION: "v5.6.1"
  COMPOSE_SHA256: "47737f4236e6d3ccea7291995203f8f018058783b4c3a9469119811a0b5db8c0"

jobs:
  dind-in-microvm:
    name: "Verify microVM hardware isolation + DinD build/run/compose with overlay2"
    runs-on: arc-dind-microvm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "Verify GKE Sandbox microVM hardware boundary (dedicated guest kernel + Cloud Hypervisor)"
        run: |
          set -euo pipefail
          echo "=== Guest kernel inside microVM (uname -r) ==="
          GUEST_KERNEL="$(uname -r)"
          echo "Guest kernel: ${GUEST_KERNEL}"
          uname -a

          echo "=== DMI product_name (expect cloud-hypervisor) ==="
          if [[ -r /sys/class/dmi/id/product_name ]]; then
            PRODUCT_NAME="$(cat /sys/class/dmi/id/product_name)"
            echo "DMI product_name: ${PRODUCT_NAME}"
            if [[ "${PRODUCT_NAME}" != *"cloud-hypervisor"* ]]; then
              echo "ERROR: expected cloud-hypervisor DMI product_name, got '${PRODUCT_NAME}'" >&2
              exit 1
            fi
          fi

      - name: "Verify Docker daemon inside microVM uses overlay2 (not vfs fallback)"
        run: |
          set -euo pipefail
          docker version
          docker info | tee /tmp/docker-info.txt
          DRIVER="$(docker info --format '{{.Driver}}')"
          echo "Docker Storage Driver inside microVM: ${DRIVER}"
          if [[ "${DRIVER}" != "overlay2" && "${DRIVER}" != "overlayfs" ]]; then
            echo "ERROR: expected overlay2/overlayfs storage driver inside microVM, got '${DRIVER}'" >&2
            exit 1
          fi
          grep "Backing Filesystem:" /tmp/docker-info.txt || true

      - name: Build and run demo-app image inside the microVM-isolated DinD runner
        run: |
          set -euo pipefail
          docker build -t demo-app:microvm ./demo-app
          docker run -d --rm --name demo-app-microvm -p 18080:8080 demo-app:microvm
          trap 'docker rm -f demo-app-microvm >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/tmp/microvm-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat /tmp/microvm-health.json
          grep -q '"status": "ok"' /tmp/microvm-health.json

      - name: Install pinned Docker Compose plugin
        run: |
          set -euo pipefail
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p ~/.docker/cli-plugins
            curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
              -o ~/.docker/cli-plugins/docker-compose
            echo "${COMPOSE_SHA256}  ${HOME}/.docker/cli-plugins/docker-compose" | sha256sum -c -
            chmod +x ~/.docker/cli-plugins/docker-compose
          fi
          docker compose version

      - name: Run multi-container stack with Docker Compose inside microVM
        run: |
          set -euo pipefail
          trap 'docker compose -f demo-app/compose.yaml down -v >/dev/null 2>&1 || true' EXIT
          docker compose -f demo-app/compose.yaml up -d --build --wait

          curl -fsS http://127.0.0.1:18081/healthz | tee /tmp/compose-health.json
          grep -q '"service": "demo-app-compose"' /tmp/compose-health.json
